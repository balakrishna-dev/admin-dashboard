<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Aurora Admin — a modern, animated admin dashboard by Balakrishna Undela." />
    <meta name="author" content="Balakrishna Undela" />
    <meta name="theme-color" content="#07070d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
    <title>Aurora Admin · Balakrishna Undela</title>
    <script>
      try {
        const t = localStorage.getItem('aurora-theme') || 'dark'
        document.documentElement.dataset.theme = t
        const a = localStorage.getItem('aurora-accent')
        if (a) document.documentElement.dataset.accent = a
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
